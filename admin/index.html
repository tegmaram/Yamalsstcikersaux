<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Yamal's Stickers AUX</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1b2130;
      --border: #2a3142;
      --text: #e6e9f0;
      --muted: #8a93a6;
      --accent: #4ade80;
      --accent-2: #60a5fa;
      --danger: #f87171;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2340 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header.top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; padding-bottom: .75rem; border-bottom: 1px solid var(--border);
    }
    header.top h1 { margin: 0; font-size: 1.25rem; letter-spacing: .5px; }
    header.top .badge { font-size: .75rem; color: var(--muted); background: var(--panel); padding: .25rem .6rem; border-radius: 999px; border: 1px solid var(--border); }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .card h2 { margin: 0 0 .75rem; font-size: 1.05rem; color: var(--accent-2); }
    .card h3 { margin: 1rem 0 .5rem; font-size: .95rem; color: var(--muted); }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    button {
      padding: .5rem .85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
    }
    button:hover { border-color: var(--accent-2); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.primary { background: linear-gradient(180deg,#2f855a,#1f6f4a); border-color: #2f855a; color: #fff; }
    button.primary:hover { border-color: var(--accent); }
    button.danger { background: linear-gradient(180deg,#9b2c2c,#7f1d1d); border-color: #9b2c2c; color: #fff; }
    button.warn { background: linear-gradient(180deg,#b7791f,#92610a); border-color: #b7791f; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
      padding: .55rem .7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0f131b;
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(96,165,250,.15);
    }
    textarea { resize: vertical; min-height: 60px; }
    .stock { font-weight: 700; padding: .15rem .5rem; border-radius: 6px; font-size: .85rem; }
    .stock.ok { background: rgba(74,222,128,.12); color: var(--accent); border: 1px solid rgba(74,222,128,.3); }
    .stock.out { background: rgba(248,113,113,.12); color: var(--danger); border: 1px solid rgba(248,113,113,.3); }
    .sticker-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto auto;
      gap: .6rem;
      align-items: center;
      padding: .7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: .5rem 0;
      background: rgba(255,255,255,.02);
    }
    .sticker-item .title { font-weight: 600; }
    .sticker-item .meta { font-size: .75rem; color: var(--muted); }
    .order {
      border-left: 3px solid var(--accent-2);
      padding: .8rem 1rem;
      margin: .75rem 0;
      background: rgba(96,165,250,.05);
      border-radius: 0 10px 10px 0;
    }
    .order .head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .order .id { font-family: monospace; font-size: .85rem; color: var(--accent-2); }
    .order .small { font-size: .78rem; color: var(--muted); }
    .order .kv { font-size: .85rem; margin: .15rem 0; }
    .order .kv b { color: var(--text); }
    .order .actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
    .order .actions button { font-size: .75rem; padding: .3rem .6rem; }
    .status-pill {
      font-size: .7rem; padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .status-pill.new { color: var(--warn); border-color: var(--warn); }
    .status-pill.contacted { color: var(--accent-2); border-color: var(--accent-2); }
    .status-pill.done { color: var(--accent); border-color: var(--accent); }
    .status-pill.spam { color: var(--danger); border-color: var(--danger); }
    .small { font-size: .8rem; color: var(--muted); }
    .sep { height: 1px; background: var(--border); margin: 1rem 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    @media (max-width: 640px) {
      .sticker-item { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
    .toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--panel); border: 1px solid var(--border); padding: .75rem 1rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: none; }
    .toast.show { display: block; }
    .toast.err { border-color: var(--danger); }
    .lock { text-align: center; padding: 3rem 1rem; }
    .lock h2 { color: var(--accent-2); }
    .lock input { width: 100%; max-width: 320px; margin: .5rem 0; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="lock" id="lock">
      <h2>🔒 Admin-Zugang</h2>
      <p class="small">Geschützt. Token eingeben oder Cloudflare Access nutzen.</p>
      <input type="password" id="token-input" placeholder="Admin-Token" />
      <br />
      <button class="primary" id="unlock-btn">Entsperren</button>
      <p class="small" id="lock-msg"></p>
    </div>

    <div id="panel" class="hidden">
      <header class="top">
        <h1>Yamal's Stickers AUX — Admin</h1>
        <span class="badge" id="whoami">authed</span>
      </header>

      <div class="card">
        <h2>Sticker &amp; Bestand</h2>
        <div id="stickers"><span class="spinner"></span> Lade…</div>
        <div class="sep"></div>
        <h3>Neuen Sticker hinzufügen</h3>
        <div class="grid2">
          <input id="n-id" placeholder="id (z.B. neues-motiv)" />
          <input id="n-title" placeholder="Titel" />
          <input id="n-tag" placeholder="Tag (Augsburg/LA/FCA)" />
          <input id="n-image" placeholder="Bildpfad ./assets/stickers/x.jpg" />
          <input id="n-stock" type="number" placeholder="Bestand" value="0" />
          <input id="n-price" placeholder="Preis VB" value="VB" />
        </div>
        <textarea id="n-desc" placeholder="Beschreibung"></textarea>
        <div class="row" style="margin-top:.6rem;">
          <button class="primary" id="add-btn">Hinzufügen</button>
          <button id="reload-stickers">Aktualisieren</button>
        </div>
      </div>

      <div class="card">
        <h2>Bestellungen</h2>
        <div class="row">
          <select id="status-filter">
            <option value="">Alle</option>
            <option value="new">Neu</option>
            <option value="contacted">Kontaktiert</option>
            <option value="done">Erledigt</option>
            <option value="spam">Spam</option>
          </select>
          <button id="reload-orders">Aktualisieren</button>
        </div>
        <div id="orders"><span class="spinner"></span> Lade…</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '/api/admin';
    const TOKEN_KEY = 'yamal_admin_token';
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function toast(msg, err) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (err ? ' err' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 3200);
    }

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const t = getToken();
      if (t) headers['X-Admin-Token'] = t;
      const res = await fetch(API + path, { ...opts, headers });
      if (res.status === 401) { clearToken(); showLock('Token ungültig oder abgelaufen.'); throw new Error('unauthorized'); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function showLock(msg) {
      document.getElementById('lock').classList.remove('hidden');
      document.getElementById('panel').classList.add('hidden');
      if (msg) document.getElementById('lock-msg').textContent = msg;
    }
    function showPanel() {
      document.getElementById('lock').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
    }

    async function tryUnlock(token) {
      setToken(token);
      try {
        await api('/stickers');
        showPanel();
        await loadStickers();
        await loadOrders();
        toast('Entsperrt.');
      } catch (e) {
        clearToken();
        showLock('Token ungültig.');
      }
    }

    document.getElementById('unlock-btn').addEventListener('click', () => {
      const t = document.getElementById('token-input').value.trim();
      if (!t) return;
      tryUnlock(t);
    });
    document.getElementById('token-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('unlock-btn').click();
    });

    // auto-unlock if token present
    if (getToken()) tryUnlock(getToken());

    async function loadStickers() {
      const data = await api('/stickers');
      const el = document.getElementById('stickers');
      el.innerHTML = '';
      (data.stickers || []).forEach(s => {
        const div = document.createElement('div');
        div.className = 'sticker-item';
        div.innerHTML = `
          <div>
            <div class="title">${escape(s.title)}</div>
            <div class="meta">${escape(s.id)} · ${escape(s.tag || '')} · ${escape(s.image)}</div>
          </div>
          <span class="stock ${s.stock > 0 ? 'ok' : 'out'}">${s.stock}</span>
          <button data-act="minus" data-id="${s.id}">−1</button>
          <button data-act="plus" data-id="${s.id}">+1</button>
          <button data-act="toggle" data-id="${s.id}" data-active="${s.active}">${s.active ? 'Deaktivieren' : 'Aktivieren'}</button>
          <button class="danger" data-act="del" data-id="${s.id}">Löschen</button>
        `;
        el.appendChild(div);
      });
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', onStickerAction));
    }

    async function onStickerAction(e) {
      const btn = e.currentTarget;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      try {
        if (act === 'minus') await api('/stickers', { method: 'PATCH', body: JSON.stringify({ id, delta: -1 }) });
        else if (act === 'plus') await api('/stickers', { method: 'PATCH', body: JSON.stringify({ id, delta: 1 }) });
        else if (act === 'toggle') {
          const data = await api('/stickers');
          const s = (data.stickers || []).find(x => x.id === id);
          if (s) await api('/stickers?id=' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify({ ...s, active: s.active ? false : true }) });
        } else if (act === 'del') {
          if (!confirm('Sticker wirklich löschen?')) return;
          await api('/stickers?id=' + encodeURIComponent(id), { method: 'DELETE' });
        }
        await loadStickers();
        toast('OK');
      } catch (err) { toast('Fehler: ' + err.message, true); }
    }

    document.getElementById('add-btn').addEventListener('click', async () => {
      const body = {
        id: document.getElementById('n-id').value.trim(),
        title: document.getElementById('n-title').value.trim(),
        tag: document.getElementById('n-tag').value.trim(),
        image: document.getElementById('n-image').value.trim(),
        description: document.getElementById('n-desc').value.trim(),
        stock: parseInt(document.getElementById('n-stock').value, 10) || 0,
        priceVb: document.getElementById('n-price').value.trim() || 'VB',
        active: true,
      };
      if (!body.id || !body.title || !body.image) { toast('ID, Titel und Bildpfad erforderlich', true); return; }
      try {
        await api('/stickers', { method: 'POST', body: JSON.stringify(body) });
        await loadStickers();
        toast('Sticker hinzugefügt.');
      } catch (err) { toast('Fehler: ' + err.message, true); }
    });
    document.getElementById('reload-stickers').addEventListener('click', () => loadStickers().catch(e => toast(e.message, true)));

    async function loadOrders() {
      const status = document.getElementById('status-filter').value;
      const q = status ? '?status=' + encodeURIComponent(status) : '';
      const data = await api('/orders' + q);
      const el = document.getElementById('orders');
      el.innerHTML = '';
      (data.orders || []).forEach(o => {
        const div = document.createElement('div');
        div.className = 'order';
        div.innerHTML = `
          <div class="head">
            <span class="id">${escape(o.id)}</span>
            <span class="status-pill ${escape(o.status)}">${escape(o.status)}</span>
          </div>
          <div class="small">${escape(o.created_at)}</div>
          <div class="kv"><b>IP:</b> ${escape(o.ip)} (${escape(o.country || '?')})</div>
          <div class="kv"><b>UA:</b> ${escape(o.user_agent)}</div>
          <div class="kv"><b>Referrer:</b> ${escape(o.referrer || '-')}</div>
          <div class="kv"><b>Items:</b> ${escape(o.items_json)}</div>
          <div class="kv"><b>Preis:</b> ${o.offered_price == null ? 'VB' : escape(o.offered_price) + ' €'} · <b>Kontakt:</b> ${escape(o.contact || '-')}</div>
          <div class="kv"><b>Nachricht:</b> ${escape(o.message || '-')}</div>
          <div class="actions">
            ${['new','contacted','done','spam'].map(st => `<button data-oid="${escape(o.id)}" data-st="${st}">${st}</button>`).join('')}
          </div>
        `;
        el.appendChild(div);
      });
      if (!(data.orders || []).length) el.innerHTML = '<p class="small">Keine Bestellungen.</p>';
      el.querySelectorAll('button[data-oid]').forEach(b => b.addEventListener('click', async () => {
        try {
          await api('/orders', { method: 'PATCH', body: JSON.stringify({ id: b.dataset.oid, status: b.dataset.st }) });
          await loadOrders();
          toast('Status aktualisiert.');
        } catch (err) { toast('Fehler: ' + err.message, true); }
      }));
    }
    document.getElementById('reload-orders').addEventListener('click', () => loadOrders().catch(e => toast(e.message, true)));
    document.getElementById('status-filter').addEventListener('change', () => loadOrders().catch(e => toast(e.message, true)));

    if (getToken()) { tryUnlock(getToken()); }
  </script>
</body>
</html>
