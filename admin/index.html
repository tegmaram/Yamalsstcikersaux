<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Yamal's Stickers AUX</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f5f5f5; }
    h1, h2 { margin: .5rem 0; }
    .card { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .4rem 0; }
    button { padding: .4rem .7rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #1a7f37; color: #fff; border-color: #1a7f37; }
    button.danger { background: #c0392b; color: #fff; border-color: #c0392b; }
    input, textarea, select { padding: .4rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .stock { font-weight: 700; }
    .out { color: #c0392b; }
    .ok { color: #1a7f37; }
    .order { border-left: 3px solid #1a4fb3; padding-left: .6rem; margin: .6rem 0; }
    .small { font-size: .8rem; color: #666; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #eee; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Admin – Yamal's Stickers AUX</h1>
  <p class="small">Geschützt via Cloudflare Access. Nur du hast Zugriff.</p>

  <div class="card">
    <h2>Sticker &amp; Bestand</h2>
    <div id="stickers">Lade…</div>
    <hr />
    <h3>Neuen Sticker hinzufügen</h3>
    <div class="row"><input id="n-id" placeholder="id (z.B. neues-motiv)" /><input id="n-title" placeholder="Titel" /></div>
    <div class="row"><input id="n-tag" placeholder="Tag" /><input id="n-image" placeholder="Bildpfad ./assets/stickers/x.jpg" /></div>
    <div class="row"><input id="n-stock" type="number" placeholder="Bestand" value="0" /><input id="n-price" placeholder="Preis VB" value="VB" /></div>
    <div class="row"><textarea id="n-desc" placeholder="Beschreibung"></textarea></div>
    <button class="primary" id="add-btn">Hinzufügen</button>
  </div>

  <div class="card">
    <h2>Bestellungen</h2>
    <div class="row">
      <select id="status-filter">
        <option value="">Alle</option>
        <option value="new">Neu</option>
        <option value="contacted">Kontaktiert</option>
        <option value="done">Erledigt</option>
        <option value="spam">Spam</option>
      </select>
      <button id="reload-orders">Aktualisieren</button>
    </div>
    <div id="orders">Lade…</div>
  </div>

  <script>
    const API = '/api/admin';
    const TOKEN_KEY = 'yamal_admin_token';
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const t = getToken();
      if (t) headers['X-Admin-Token'] = t;
      const res = await fetch(API + path, { ...opts, headers });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // token gate
    if (!getToken()) {
      const t = prompt('Admin-Token eingeben:');
      if (t) setToken(t.trim());
    }

    async function loadStickers() {
      const data = await api('/stickers');
      const el = document.getElementById('stickers');
      el.innerHTML = '';
      (data.stickers || []).forEach(s => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
          <strong>${escape(s.title)}</strong>
          <span class="stock ${s.stock > 0 ? 'ok' : 'out'}">${s.stock}</span>
          <button data-act="minus" data-id="${s.id}">-1</button>
          <button data-act="plus" data-id="${s.id}">+1</button>
          <button data-act="toggle" data-id="${s.id}" data-active="${s.active}">${s.active ? 'Deaktivieren' : 'Aktivieren'}</button>
          <button class="danger" data-act="del" data-id="${s.id}">Löschen</button>
        `;
        el.appendChild(div);
      });
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', onStickerAction));
    }

    async function onStickerAction(e) {
      const btn = e.currentTarget;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      try {
        if (act === 'minus') await api('/stickers', { method: 'PATCH', body: JSON.stringify({ id, delta: -1 }) });
        else if (act === 'plus') await api('/stickers', { method: 'PATCH', body: JSON.stringify({ id, delta: 1 }) });
        else if (act === 'toggle') {
          const active = btn.dataset.active === '1' ? false : true;
          // fetch current sticker to update fully
          const data = await api('/stickers');
          const s = (data.stickers || []).find(x => x.id === id);
          if (s) {
            await api('/stickers?id=' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify({ ...s, active }) });
          }
        } else if (act === 'del') {
          if (!confirm('Sticker wirklich löschen?')) return;
          await api('/stickers?id=' + encodeURIComponent(id), { method: 'DELETE' });
        }
        await loadStickers();
      } catch (err) { alert('Fehler: ' + err.message); }
    }

    document.getElementById('add-btn').addEventListener('click', async () => {
      const body = {
        id: document.getElementById('n-id').value.trim(),
        title: document.getElementById('n-title').value.trim(),
        tag: document.getElementById('n-tag').value.trim(),
        image: document.getElementById('n-image').value.trim(),
        description: document.getElementById('n-desc').value.trim(),
        stock: parseInt(document.getElementById('n-stock').value, 10) || 0,
        priceVb: document.getElementById('n-price').value.trim() || 'VB',
        active: true,
      };
      if (!body.id || !body.title || !body.image) { alert('ID, Titel und Bildpfad erforderlich'); return; }
      try {
        await api('/stickers', { method: 'POST', body: JSON.stringify(body) });
        await loadStickers();
      } catch (err) { alert('Fehler: ' + err.message); }
    });

    async function loadOrders() {
      const status = document.getElementById('status-filter').value;
      const q = status ? '?status=' + encodeURIComponent(status) : '';
      const data = await api('/orders' + q);
      const el = document.getElementById('orders');
      el.innerHTML = '';
      (data.orders || []).forEach(o => {
        const div = document.createElement('div');
        div.className = 'order';
        div.innerHTML = `
          <div><strong>${escape(o.id)}</strong> <span class="small">${escape(o.created_at)}</span> <span class="small">[${escape(o.status)}]</span></div>
          <div class="small">IP: ${escape(o.ip)} (${escape(o.country)}) | ${escape(o.user_agent)}</div>
          <div class="small">Referrer: ${escape(o.referrer || '-')} | Lang: ${escape(o.lang || '-')}</div>
          <div>Items: ${escape(o.items_json)}</div>
          <div>Preis: ${o.offered_price == null ? 'VB' : o.offered_price + ' €'} | Kontakt: ${escape(o.contact || '-')}</div>
          <div>Nachricht: ${escape(o.message || '-')}</div>
          <div class="row">
            ${['new','contacted','done','spam'].map(st => `<button data-oid="${o.id}" data-st="${st}">${st}</button>`).join('')}
          </div>
        `;
        el.appendChild(div);
      });
      el.querySelectorAll('button[data-oid]').forEach(b => b.addEventListener('click', async () => {
        try {
          await api('/orders', { method: 'PATCH', body: JSON.stringify({ id: b.dataset.oid, status: b.dataset.st }) });
          await loadOrders();
        } catch (err) { alert('Fehler: ' + err.message); }
      }));
    }
    document.getElementById('reload-orders').addEventListener('click', loadOrders);
    document.getElementById('status-filter').addEventListener('change', loadOrders);

    function escape(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    loadStickers();
    loadOrders();
  </script>
</body>
</html>
